[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aiomon"
dynamic = ["version"]
description = "Simple asyncio-based monitor for healthchecks and metrics"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["asyncio", "monitor", "monitoring", "healthcheck", "metrics"]
authors = [
  { name = "Lev Rubel", email = "rubel.lev@gmail.com" },
]
include = ["CHANGELOG.md", "examples/**/*"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "aiorwlock>=1.3.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
  "coverage[toml]>=7,<8",
  "pytest>=7.4.0,<8.0.0",
  "pytest-asyncio>=0.21.0,<1.0.0",
  "pytest-mypy-plugins>=2.0.0,<3.0.0",
  "black>=23.1.0",
  "mypy>=1.0.0",
  "ruff>=0.0.243",
]

[project.urls]
Documentation = "https://github.com/levchik/aiomon#readme"
Issues = "https://github.com/levchik/aiomon/issues"
Source = "https://github.com/levchik/aiomon"

[tool.hatch.version]
path = "src/aiomon/__about__.py"

[dependency-groups]
dev = [
  "coverage[toml]>=7,<8",
  "pytest>=7.4.0,<8.0.0",
  "pytest-asyncio>=0.21.0,<1.0.0",
  "pytest-mypy-plugins>=2.0.0,<3.0.0",
  "black>=23.1.0",
  "mypy>=1.0.0",
  "ruff>=0.0.243",
]

[tool.uv]
dev-dependencies = [
  "coverage[toml]>=7,<8",
  "pytest>=7.4.0,<8.0.0",
  "pytest-asyncio>=0.21.0,<1.0.0",
  "pytest-mypy-plugins>=2.0.0,<3.0.0",
  "black>=23.1.0",
  "mypy>=1.0.0",
  "ruff>=0.0.243",
]

[tool.black]
target-version = ["py311"]
line-length = 79
skip-string-normalization = true

[tool.mypy]
check_untyped_defs = true
no_implicit_optional = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
follow_imports = "normal"
ignore_missing_imports = true
pretty = true
show_column_numbers = true
show_error_codes = true
warn_no_return = false
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "tests.*"
]
disable_error_code = [
    "func-returns-value",
    "no-untyped-def",
    "var-annotated"
]

[tool.ruff]
target-version = "py311"
line-length = 79
select = [
  "A",
  "ARG",
  "B",
  "C",
  "DTZ",
  "E",
  "EM",
  "F",
  "FBT",
  "I",
  "ICN",
  "ISC",
  "N",
  "PLC",
  "PLE",
  "PLR",
  "PLW",
  "Q",
  "RUF",
  "S",
  "T",
  "TID",
  "UP",
  "W",
  "YTT",
]
ignore = [
  # Allow non-abstract empty methods in abstract base classes
  "B027",
  # Allow boolean positional values in function calls, like `dict.get(... True)`
  "FBT003",
  # Ignore checks for possible passwords
  "S105", "S106", "S107",
  # Ignore complexity
  "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915",
]
unfixable = [
  # Don't touch unused imports
  "F401",
]

[tool.ruff.isort]
known-first-party = ["aiomon"]

[tool.ruff.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true

[tool.ruff.per-file-ignores]
# Tests can use magic values, assertions, and relative imports
"tests/**/*" = ["PLR2004", "S101", "TID252"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
python_files = [
    "tests.py",
    "test_*.py",
    "*_tests.py"
]

[tool.coverage.run]
source_pkgs = ["aiomon", "tests"]
branch = true
omit = [
  "src/aiomon/__about__.py",
  "tests/*",
]

[tool.coverage.paths]
aiomon = ["src/aiomon", "*/aiomon/src/aiomon"]
tests = ["tests", "*/aiomon/tests"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    '''class .*\bProtocol.*\):''',
    '''@(abc\.)?abstractmethod'''
]
show_missing = true
fail_under = 85
